name: Release

# Automatique : chaque CI verte sur main crée une release versionnée et la publie
# dès qu'un OS a fini ses installeurs, sans attendre les autres. Lancement manuel
# possible depuis Actions > Release > Run workflow.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publication-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Préparer la release
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Calculer la version et créer la release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          RUN: ${{ github.event.workflow_run.run_number || github.run_number }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt || github.run_attempt }}
        run: |
          set -euo pipefail
          base="$(node -p 'require("./package.json").version.split("-")[0]')"
          version="${base}-beta.${RUN}.${ATTEMPT}"
          tag="v${version}"

          id="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq "first(.[] | select(.tag_name == \"$tag\") | .id) // empty")"

          if [ -z "$id" ]; then
            id="$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$tag" \
              -f target_commitish="$SHA" \
              -f name="$tag" \
              -F draft=true \
              -F prerelease=false \
              -F generate_release_notes=true \
              --jq '.id')"
          elif [ "$(gh api "repos/$GITHUB_REPOSITORY/releases/$id" --jq '.draft')" = "true" ]; then
            # Réexécution : on refixe le brouillon sur le commit testé.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -f target_commitish="$SHA" > /dev/null
          fi

          echo "Release $tag ($id) sur $SHA"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: Windows arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis
          - name: macOS universel
            os: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: app,dmg
          # 22.04 : glibc plus ancienne, l'AppImage tourne sur plus de distributions
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            # RPM refuse le « - » d'une préversion (0.1.0-beta.1) : remettre rpm pour une version stable
            # bundles: deb,rpm,appimage
            bundles: deb,appimage
          - name: Linux arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            # RPM refuse le « - » d'une préversion (0.1.0-beta.1) : remettre rpm pour une version stable
            # bundles: deb,rpm,appimage
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Dépendances système de Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets || matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile

      # Après setup-node : `node` est garanti disponible, y compris sur Windows arm64.
      - name: Définir la version de la release
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          node -e 'const fs = require("fs"); const pkg = require("./package.json"); pkg.version = process.env.RELEASE_VERSION; fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n")'

      # Sans clé de signature (fréquent sur un fork), on désactive les artefacts
      # de mise à jour pour que les installeurs soient quand même produits.
      - name: Configurer la signature
        id: signing
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEY" ]; then
            printf '%s\n' '{"bundle":{"createUpdaterArtifacts":false}}' > src-tauri/tauri.unsigned.json
            echo "config=--config src-tauri/tauri.unsigned.json" >> "$GITHUB_OUTPUT"
            echo "Signature absente : artefacts de mise à jour désactivés."
          else
            {
              echo "TAURI_SIGNING_PRIVATE_KEY<<TAURI_KEY_EOF"
              echo "$SIGNING_KEY"
              echo "TAURI_KEY_EOF"
              echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD<<TAURI_PASSWORD_EOF"
              echo "$SIGNING_PASSWORD"
              echo "TAURI_PASSWORD_EOF"
            } >> "$GITHUB_ENV"
            echo "config=" >> "$GITHUB_OUTPUT"
            echo "Signature configurée."
          fi

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} ${{ steps.signing.outputs.config }}

      # Dès qu'un OS a fini d'uploader ses installeurs, la release devient publique.
      # Les autres jobs ajoutent leurs artefacts à cette release déjà publiée.
      - name: Publier la release dès qu'un build est prêt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          set -euo pipefail
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --jq '.draft')" = "true" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false
          fi

  publish:
    name: Vérifier la publication
    needs: [prepare, build]
    # Tourne même si un OS échoue : la release doit rester publiée dès qu'un artefact existe.
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publier la release si au moins un artefact est prêt
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          set -euo pipefail
          assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --jq 'length')"
          if [ "$assets" -eq 0 ]; then
            echo "::error::Aucun artefact n'a été publié : la release reste en brouillon."
            exit 1
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false

  notify:
    name: Annoncer sur Discord
    needs: [prepare, publish]
    runs-on: ubuntu-24.04
    steps:
      - name: Envoyer les notes sur le salon
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          IMAGE_URL: https://raw.githubusercontent.com/PierideApp/Pieride/main/.github/assets/changelog.png
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "DISCORD_WEBHOOK_URL absent : annonce ignorée."
            exit 0
          fi
          payload="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" | jq '
            ((.name | select(. != "")) // .tag_name) as $titre
            | (("\n" + (.body // "" | gsub("\r"; ""))) | [splits("\n(?=### )")] | map(gsub("^\\s+|\\s+$"; ""))) as $blocs
            | [
                { type: 10, content: ("## \($titre)\n\($blocs[0])" | gsub("^\\s+|\\s+$"; "")) },
                { type: 14, divider: true, spacing: 1 },
                ($blocs[1:][] | { type: 10, content: . }),
                { type: 14, divider: true, spacing: 1 },
                { type: 10, content: "-# [Télécharger sur GitHub](<\(.html_url)>)" }
              ] as $textes
            | ($textes | map(.content // "") | add | length) as $taille
            | if $taille > 4000 then error("Notes trop longues pour Discord : \($taille) caractères sur 4000") else . end
            | {
                flags: 32768,
                allowed_mentions: { parse: [] },
                components: [{
                  type: 17,
                  accent_color: 3289658,
                  components: [
                    ($ENV.IMAGE_URL // "" | select(. != "") | { type: 12, items: [{ media: { url: . } }] }),
                    $textes[]
                  ]
                }]
              }
          ')"
          curl -sS --fail-with-body -H "Content-Type: application/json" -d "$payload" \
            "$DISCORD_WEBHOOK_URL?with_components=true"
